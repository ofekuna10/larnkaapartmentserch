<title>Larnaca Unit Models</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --ink:#1b2027; --ink-2:#3c454f; --muted:#77808b;
  --ground:#eceae4; --surface:#f7f5f1; --surface-2:#ffffff;
  --line:#d5d1c8; --line-2:#c2bcb0;
  --aegean:#0e6a75; --aegean-soft:#d9e8e8;
  --teak:#b0714b; --stage-top:#dfe4e6; --stage-bot:#c4ccd0;
  --shadow:0 1px 2px rgba(27,32,39,.06),0 8px 24px -12px rgba(27,32,39,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#eceae4; --ink-2:#b9bfc7; --muted:#8b939d;
  --ground:#12161b; --surface:#181d23; --surface-2:#1f252c;
  --line:#2b323a; --line-2:#39424c;
  --aegean:#4fb8bf; --aegean-soft:#123036;
  --teak:#c98b62; --stage-top:#1b2127; --stage-bot:#0c1013;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ink:#eceae4; --ink-2:#b9bfc7; --muted:#8b939d;
  --ground:#12161b; --surface:#181d23; --surface-2:#1f252c;
  --line:#2b323a; --line-2:#39424c;
  --aegean:#4fb8bf; --aegean-soft:#123036;
  --teak:#c98b62; --stage-top:#1b2127; --stage-bot:#0c1013;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;font-size:14px;line-height:1.5;
  height:100vh;overflow:hidden}
#app{display:grid;grid-template-columns:308px 1fr;height:100vh}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}}

aside{background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;overflow-y:auto}
.plate{padding:22px 22px 16px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 10px/1.4 "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted)}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:25px;line-height:1.1;
  margin:.35rem 0 .5rem;text-wrap:balance;font-variation-settings:"opsz" 40}
.plate p{margin:0;color:var(--ink-2);font-size:12.5px;max-width:34ch}

.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:14px 22px}
.tab{appearance:none;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink-2);
  font:600 13px/1 Archivo,sans-serif;padding:10px 0;border-radius:3px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s}
.tab:hover{border-color:var(--aegean);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--aegean);border-color:var(--aegean);color:#fff}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#08181b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#08181b}}
.tab:focus-visible{outline:2px solid var(--aegean);outline-offset:2px}

.sect{padding:4px 22px 18px}
.sect h2{font:500 10px/1.4 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.unit-name{font-family:Fraunces,Georgia,serif;font-size:16px;line-height:1.25;margin:0 0 12px;
  font-variation-settings:"opsz" 24}
.areas{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0}
.areas dt{color:var(--ink-2);font-size:12.5px}
.areas dd{margin:0;font:500 12.5px/1.5 "IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  text-align:right;color:var(--ink)}
.areas dd.big{color:var(--aegean)}
.areas dt.big{color:var(--ink);font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:5px 0;border-bottom:1px solid var(--line);vertical-align:baseline}
td:last-child{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;
  color:var(--ink-2);white-space:nowrap;padding-left:8px}
tr:last-child td{border-bottom:none}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--ink-2)}
.legend span{display:flex;align-items:center;gap:8px}
.sw{width:14px;height:10px;border-radius:2px;flex:none;border:1px solid rgba(0,0,0,.12)}
.note{font-size:11.5px;color:var(--muted);margin:0;max-width:36ch}

main{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;display:flex;gap:4px;
  padding:4px;background:color-mix(in srgb,var(--surface) 88%,transparent);
  border:1px solid var(--line);border-radius:4px;box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.hud button{appearance:none;border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:500 12px/1 Archivo,sans-serif;padding:9px 13px;border-radius:3px}
.hud button:hover{background:var(--aegean-soft);color:var(--ink)}
.hud button[aria-pressed="true"]{background:var(--aegean);color:#fff}
:root[data-theme="dark"] .hud button[aria-pressed="true"]{color:#08181b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .hud button[aria-pressed="true"]{color:#08181b}}
.hud button:focus-visible{outline:2px solid var(--aegean);outline-offset:-2px}
.hud .div{width:1px;background:var(--line);margin:4px 3px}
.tip{position:absolute;left:16px;bottom:18px;font:400 11.5px/1.5 "IBM Plex Mono",monospace;
  color:var(--muted);pointer-events:none;max-width:16ch}
.scalebar{position:absolute;right:16px;bottom:20px;font:500 10px/1 "IBM Plex Mono",monospace;
  color:var(--muted);text-align:center;pointer-events:none}
.scalebar i{display:block;height:5px;border:1px solid var(--line-2);border-top:0;margin-bottom:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
